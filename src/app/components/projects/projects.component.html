<section class="min-h-screen bg-black text-white py-16 px-4 md:px-8">
    <div class="container mx-auto max-w-5xl">
      <div class="mb-12">
        <h2 class="text-4xl md:text-5xl font-bold mb-2 text-neon">PROJECTS</h2>
        <div class="w-8 h-1 bg-neon"></div>
      </div>
  
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div *ngFor="let project of projects" class="group">
          <div class="bg-[#282828] rounded-lg overflow-hidden transition-all duration-300 hover:shadow-lg hover:shadow-neon/20 h-full flex flex-col">
            <!-- Project Image -->
            <div class="h-48 overflow-hidden">
              <img [src]="project.image" [alt]="project.title" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
            </div>
            
            <!-- Project Content -->
            <div class="p-6 flex-grow flex flex-col">
              <div class="flex justify-between items-start mb-3">
                <span class="text-xs text-black bg-neon bg-opacity-10 px-3 py-1 rounded-full">{{ project.category }}</span>
                <span class="text-xs text-gray-400">{{ project.period }}</span>
              </div>
              
              <h3 class="text-xl font-bold mb-3 group-hover:text-neon transition-colors">{{ project.title }}</h3>
              
              <p class="text-gray-300 mb-4 flex-grow">{{ project.description }}</p>
              
              <div>
                <h4 class="text-sm font-semibold mb-2 text-gray-400">Technologies</h4>
                <div class="flex flex-wrap gap-2">
                  <span *ngFor="let tech of project.technologies" 
                        class="px-2 py-1 bg-black text-xs rounded-full">
                    {{ tech }}
                  </span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
  
  <div class="fixed bottom-4 right-4">
     
    <button routerLink="/" class=" bg-[#e6ff00] border-[2px] border-[#e6ff00] text-black px-4 py-2 rounded-full text-sm font-medium  hover:border-[2px]   hover:bg-black hover:text-[#e6ff00] transition-colors">
      Take Me Home
    </button>
  </div>


  <app-rising-stars></app-rising-stars>

  <app-footer></app-footer>
