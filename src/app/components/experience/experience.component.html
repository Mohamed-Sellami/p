<section class="min-h-screen bg-black text-white py-16 px-4 md:px-8">
  <div class="container mx-auto max-w-5xl">
    <div class="mb-12">
      <h2 class="text-4xl md:text-5xl font-bold mb-2 text-neon">EXPERIENCE</h2>
      <div class="w-8 h-1 bg-neon"></div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
      <!-- Professional Experience -->
      <div>
        <h3 class="text-2xl font-bold mb-6">Professional Experience</h3>
        
        <div class="space-y-12">
          <div *ngFor="let exp of experiences" class="relative timeline-event">
            <!-- Timeline dot -->
            <div class="absolute -left-3 top-0 w-6 h-6 rounded-full bg-neon flex items-center justify-center">
              <div class="w-2 h-2 rounded-full bg-black"></div>
            </div>
            
            <!-- Timeline line -->
            <div class="absolute -left-0 top-6 bottom-0 w-px bg-[#282828]"></div>
            
            <!-- Content -->
            <div class="pl-8">
              <div class="flex flex-col md:flex-row md:justify-between md:items-start mb-2">
                <h4 class="text-xl font-semibold text-neon">{{ exp.title }}</h4>
                <span class="text-sm bg-[#282828] px-3 py-1 rounded-full inline-block mt-1 md:mt-0">{{ exp.period }}</span>
              </div>
              <p class="text-gray-300 mb-1">{{ exp.company }} - {{ exp.location }}</p>
              <p class="text-gray-400 mb-3 text-sm italic">{{ exp.type }}</p>
              
              <ul class="list-disc list-inside space-y-1 text-gray-300">
                <li *ngFor="let resp of exp.responsibilities">{{ resp }}</li>
              </ul>
            </div>
          </div>
        </div>
      </div>

      <!-- Volunteer Experience -->
      <div>
        <h3 class="text-2xl font-bold mb-6">Volunteer Experience</h3>
        
        <div class="space-y-12">
          <div *ngFor="let vol of volunteerWork" class="relative timeline-event">
            <!-- Timeline dot -->
            <div class="absolute -left-3 top-0 w-6 h-6 rounded-full bg-[#282828] flex items-center justify-center">
              <div class="w-2 h-2 rounded-full bg-neon"></div>
            </div>
            
            <!-- Timeline line -->
            <div class="absolute -left-0 top-6 bottom-0 w-px bg-[#282828]"></div>
            
            <!-- Content -->
            <div class="pl-8">
              <div class="flex flex-col md:flex-row md:justify-between md:items-start mb-2">
                <h4 class="text-xl font-semibold">{{ vol.title }}</h4>
                <span class="text-sm bg-[#282828] px-3 py-1 rounded-full inline-block mt-1 md:mt-0">{{ vol.period }}</span>
              </div>
              <p class="text-gray-300 mb-3">{{ vol.organization }}</p>
              
              <ul class="list-disc list-inside space-y-1 text-gray-300">
                <li *ngFor="let resp of vol.responsibilities">{{ resp }}</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
